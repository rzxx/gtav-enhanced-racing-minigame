[Race]
; Finish distance band in meters. Each race rolls random in [Min, Max].
MinDistance=1200
MaxDistance=2800
; Win radius around the finish marker, meters.
FinishRadius=30
; How far ahead (meters) the honk challenge searches.
MaxChallengeRange=35
; AI cruise speed m/s (47 ~= 170 km/h). Planner caps this by curvature /
; traffic; the car capability estimate caps it by what the car can do.
AiCruiseSpeed=47
; Low-level actuator mode only (used as a trajectory servo, not intelligence):
; Calm | Rushed | Reckless | Psycho | Disciplined
;   Reckless 1074528292 - Rushed minus StopForVehicles, swerves/passes instead
;   Psycho   1074528804 - Reckless plus oncoming-lane passes (crashy but racy)
DrivingStyle=Reckless
; Raw override, 0 = use preset above. Compose from VehicleDrivingFlags bits.
DrivingStyleRaw=0
; Driver skill/personality as planner parameters (never random mistakes):
; Cautious | Balanced | Aggressive
DriverProfile=Balanced
; Risk override: -1 = use preset, else 0..1 (0 cautious, 1 psycho).
RiskTolerance=-1
; Planner overrides (0 = use preset): lookahead horizon, safety gap, grip use.
LookaheadTimeS=0
SafetyMarginM=0
GripFactor=0
; Light per-tick refresh (cruise speed + style, no repath stutter).
RefreshIntervalMs=2000
; Full repath only after crawling this long.
StuckTimeoutMs=4000
; Give up after this long, cooldown between races, honk spam guard.
RaceTimeoutMs=600000
CooldownMs=8000
HonkDebounceMs=1500
; Key to cancel an active race.
CancelKey=G
; Per-race CSV telemetry in scripts\ (samples + events). Needed for AI diagnosis.
TelemetryEnabled=1
; Spatial debug overlay: route (yellow), corridor edges (green/red),
; candidates (gray/orange) + chosen (cyan), actor predictions, aim (cyan)
; + braking point (red). Essential for trajectory debugging; off for clean races.
DebugViz=0
; Actuator: GtaDriver (EXPERIMENT: point/speed to GTA pathfinding, does not
; guarantee our trajectory; path-following error is logged) or Direct
; (steering/throttle/brake, planner unchanged). Do not expect Direct to be
; faster until its gains are validated in-game; keep GtaDriver for baseline.
Actuator=GtaDriver
